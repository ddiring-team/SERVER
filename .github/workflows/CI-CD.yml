name: EC2 배포

on:
  push:
    branches:
      - dev

jobs:
  Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Github Repository 에 올린 파일을 불러오기
        uses: actions/checkout@v4 # 라이브러리

      - name : JDK 17버전 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: application.yml 파일 만들기
        run: |
          mkdir -p ./src/main/resources    
          echo "${{ secrets.APPLICATION_PROPERTIES}}" > ./src/main/resources/application.yml   

      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      - name: 빌드하기 (테스트 제외)
        run: ./gradlew clean build -x test

      - name: AWS RESOURCE 에 접근할 수 있게 AWS CREDENTIALS 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}


      - name: ECR 에 로그인하기
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker 이미지 생성 # Dockerfile 기반으로 이미지 생성
        run: docker build -t ddiring-server .

      - name: Docker 이미지에 Tag 붙이기
        run: docker tag ddiring-server ${{ steps.login-ecr.outputs.registry }}/ddiring-server:latest

      # 위 steps 에서, login-ecr 이라는 id  에서 output(결과값) 의 registry 에 접근. 즉  레포지토리 URI 임.

      - name: ECR 에 도커 이미지 PUSH
        run: docker push ${{ steps.login-ecr.outputs.registry }}/ddiring-server:latest

      - name: SSH 로 EC2 접속
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: | # 실행중인 컨테이너 중지 및 삭제 / 실행중인 컨테이너 없다면 true 로 패스 . run 에선, ecr 의 이미지 기반으로 ddiring-server 라는 이름을 가진 컨테이너를 만들고 실행한다.
            aws ecr get-login-password --region ap-northeast-2 | sudo docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            sudo docker network create ddiring-network || true
            sudo docker stop ddiring-server || true
            sudo docker rm ddiring-server || true
            sudo docker pull ${{ steps.login-ecr.outputs.registry }}/ddiring-server:latest
            sudo docker run -d --name ddiring-server -p 8080:8080 --network ddiring-network -e JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" ${{ steps.login-ecr.outputs.registry }}/ddiring-server:latest